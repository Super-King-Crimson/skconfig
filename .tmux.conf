set -g set-clipboard on
set -g allow-passthrough on
setw -g mode-keys vi

# Remap 'v' to begin selection and 'y' to yank (copy)
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe "xclip -in -selection clipboard"

bind -T copy-mode-vi C-j send-keys -X cursor-down \; send-keys -X cursor-down \; send-keys -X cursor-down
bind -T copy-mode-vi C-k send-keys -X cursor-up \; send-keys -X cursor-up \; send-keys -X cursor-up
